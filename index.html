<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>学習ログ</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="editor-panel" aria-labelledby="app-title">
        <div class="brand-row">
          <div>
            <p class="eyebrow">my study log</p>
            <h1 id="app-title">学習ログ</h1>
          </div>
          <div class="save-state" id="save-state" aria-live="polite">未保存</div>
        </div>

        <form id="diary-form" class="diary-form">
          <label class="field-label" for="entry-date">日付</label>
          <input id="entry-date" name="date" type="date" required />

          <label class="field-label" for="entry-subject">学習テーマ</label>
          <input
            id="entry-subject"
            name="subject"
            type="text"
            maxlength="60"
            placeholder="例：英語、数学、Webデザイン"
            required
          />

          <label class="field-label" for="entry-duration">学習時間（分）</label>
          <input
            id="entry-duration"
            name="duration"
            type="number"
            min="1"
            max="1440"
            step="1"
            placeholder="例：30"
            required
          />

          <fieldset class="mood-field">
            <legend>今日の学習の手応え</legend>
            <div class="mood-grid" id="mood-grid">
              <label class="mood-option">
                <input type="radio" name="mood" value="happy" required />
                <span class="mood-face">🌟</span>
                <span>よくできた</span>
              </label>
              <label class="mood-option">
                <input type="radio" name="mood" value="calm" />
                <span class="mood-face">📘</span>
                <span>理解できた</span>
              </label>
              <label class="mood-option">
                <input type="radio" name="mood" value="normal" />
                <span class="mood-face">✏️</span>
                <span>ふつう</span>
              </label>
              <label class="mood-option">
                <input type="radio" name="mood" value="tired" />
                <span class="mood-face">🔁</span>
                <span>復習したい</span>
              </label>
              <label class="mood-option">
                <input type="radio" name="mood" value="sad" />
                <span class="mood-face">🧩</span>
                <span>むずかしい</span>
              </label>
            </div>
          </fieldset>

          <label class="field-label" for="entry-note">学んだこと・気づき</label>
          <textarea
            id="entry-note"
            name="note"
            rows="5"
            maxlength="500"
            placeholder="今日学んだことや、次に復習したいことを書いてみましょう"
            required
          ></textarea>
          <div class="note-meta">
            <span id="editing-label">今日の学習記録を書いています</span>
            <span><span id="char-count">0</span>/500</span>
          </div>

          <div class="action-row">
            <button class="primary-button" type="submit">学習記録を保存</button>
            <button class="ghost-button" type="button" id="clear-button">入力をリセット</button>
          </div>
        </form>
      </section>

      <section class="history-panel" aria-labelledby="history-title">
        <div class="history-header">
          <div>
            <p class="eyebrow">your progress</p>
            <h2 id="history-title">学習記録</h2>
          </div>
          <div class="header-stats">
            <div class="stats-strip" aria-label="学習記録の数">
              <strong id="entry-count">0</strong>
              <span>件</span>
            </div>
            <div class="stats-strip total-time" aria-label="合計学習時間">
              <span>合計</span>
              <strong id="total-study-time">0分</strong>
            </div>
          </div>
        </div>

        <section class="biorhythm" aria-labelledby="biorhythm-title">
          <div>
            <p class="biorhythm-label" id="biorhythm-title">学習のふりかえり</p>
            <strong id="biorhythm-message">記録を保存すると表示されます</strong>
          </div>
          <div class="rhythm-chart" id="rhythm-chart" aria-label="最近7件の学習の手応え"></div>
          <p id="biorhythm-detail" class="biorhythm-detail">最近7件の学習の手応えを表示します。</p>
        </section>

        <div class="summary-row" id="summary-row" aria-label="学習の手応えの集計"></div>

        <div class="list-tools">
          <label class="search-box" for="search-input">
            <span>検索</span>
            <input id="search-input" type="search" placeholder="テーマや学んだことから検索" />
          </label>
          <select id="mood-filter" aria-label="学習の手応えで絞り込み">
            <option value="all">すべての手応え</option>
            <option value="happy">よくできた</option>
            <option value="calm">理解できた</option>
            <option value="normal">ふつう</option>
            <option value="tired">復習したい</option>
            <option value="sad">むずかしい</option>
          </select>
        </div>

        <div id="empty-state" class="empty-state">
          <strong>学習記録はまだありません</strong>
          <span>学習テーマや時間、学んだことを記録してみましょう。</span>
        </div>

        <ul id="entry-list" class="entry-list" aria-label="保存した学習記録一覧"></ul>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
